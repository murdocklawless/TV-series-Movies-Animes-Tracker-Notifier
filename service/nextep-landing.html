<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    min-height: 100vh;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    background: #171a23;
    border-bottom: 1px solid #262a36;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { font-size: 1rem; font-weight: 700; color: #f97316; display: flex; align-items: center; gap: 8px; }
  .lp-logo-img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
  .lang-wrap { position: relative; display: inline-block; }
  .tab {
    background: transparent;
    border: 1px solid #2a2f3d;
    color: #aab;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
  }
  .tab:hover { background: rgba(249, 115, 22, 0.3); border-color: #f97316; color: #fff; }
  .tab.active { background: rgba(249, 115, 22, 0.22); border-color: #f97316; color: #fff; }
  .tabs { display: flex; gap: 8px; }
  .sort-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 200px;
    background: #1e2230;
    border: 1px solid #3a4050;
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    display: none;
    z-index: 20;
    max-height: 60vh;
    overflow-y: auto;
  }
  .sort-menu.open { display: block; }
  .sort-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #c8cdd8;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .sort-item:hover { background: rgba(249, 115, 22, 0.3); border-color: #f97316; color: #c8cdd8; }
  .sort-item.active { background: rgba(249, 115, 22, 0.3); border-color: #f97316; color: #c8cdd8; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { color: #f97316; font-size: 1.9rem; margin-bottom: 8px; }
  .tagline { color: #c9cedb; font-size: 1.05rem; line-height: 1.6; margin-bottom: 32px; }
  h2 { color: #e6e6e6; font-size: 1.25rem; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #262a36; }
  ul.feat { list-style: none; padding: 0; }
  ul.feat li { position: relative; padding-left: 22px; margin: 10px 0; color: #c9cedb; font-size: 0.95rem; line-height: 1.6; }
  ul.feat li::before { content: "▪"; position: absolute; left: 4px; top: 0; color: #f97316; font-size: 0.8rem; }
  [dir="rtl"] ul.feat li { padding-left: 0; padding-right: 22px; }
  [dir="rtl"] ul.feat li::before { left: auto; right: 4px; }
  ol.steps { list-style: none; padding: 0; counter-reset: st; }
  ol.steps li { counter-increment: st; margin: 10px 0; padding-left: 34px; position: relative; color: #c9cedb; font-size: 0.95rem; line-height: 1.6; }
  ol.steps li::before {
    content: counter(st); position: absolute; left: 0; top: 1px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #262a36; color: #f97316; font-weight: 700; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
  }
  [dir="rtl"] ol.steps li { padding-left: 0; padding-right: 34px; }
  [dir="rtl"] ol.steps li::before { left: auto; right: 0; }
</style>
</head>

function setList(el, arr) {
  el.innerHTML = "";
  for (var i = 0; i < arr.length; i++) {
    var li = document.createElement("li");
    li.textContent = arr[i];
    el.appendChild(li);
  }
}
function langName(code) {
  for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === code) return LANGS[i][1];
  return code;
}
var curLang = "en";
var lpTab = "stremio";
function setLang(code) {
  if (!LP[code]) code = "en";
  var d = LP[code];
  var c = LPC[code] || LPC.en || {};
  curLang = code;
  document.documentElement.lang = code;
  document.documentElement.dir = (code === "ar") ? "rtl" : "ltr";
  document.getElementById("lang-name").textContent = langName(code);
  // sekmeler + tagline (sekmeye gore)
  document.getElementById("lp-tab-stremio").textContent = c.tab_stremio || "Stremio";
  document.getElementById("lp-tab-calendar").textContent = c.tab_calendar || "Calendar";
  document.getElementById("lp-tagline").textContent =
    (lpTab === "calendar" && c.cal_tagline) ? c.cal_tagline : d.tagline;
  document.getElementById("lp-h1").textContent =
    (lpTab === "calendar" && c.h1_calendar) ? c.h1_calendar : (c.h1_stremio || "Stremio Plugin");
  document.getElementById("lp-logo-text").textContent = c.logo_text || "NextEp";
  // Stremio paneli
  document.getElementById("lp-what-t").textContent = d.what;
  setList(document.getElementById("lp-what"), d.w);
  document.getElementById("lp-install-t").textContent = d.install;
  setList(document.getElementById("lp-install"), d.s);
  document.getElementById("lp-notes-t").textContent = d.notes;
  setList(document.getElementById("lp-notes"), d.n);
  // Takvim paneli (1.85) — ayni sema: Ne ise yarar? / Kurulum / Onemli notlar
  document.getElementById("lp-cal-what-t").textContent = c.cal_what || "";
  setList(document.getElementById("lp-cal-what"), c.cal_w || []);
  document.getElementById("lp-cal-install-t").textContent = c.cal_install || "";
  setList(document.getElementById("lp-cal-install"), c.cal_s || []);
  document.getElementById("lp-cal-notes-t").textContent = c.cal_notes || "";
  setList(document.getElementById("lp-cal-notes"), c.cal_n || []);
  var items = document.querySelectorAll("#lang-menu .sort-item");
  for (var i = 0; i < items.length; i++) {
    if (items[i].getAttribute("data-lang") === code) items[i].classList.add("active");
    else items[i].classList.remove("active");
  }
  try { localStorage.setItem("lp_lang", code); } catch (e) {}
}
function setTab(t) {
  lpTab = (t === "calendar") ? "calendar" : "stremio";
  document.getElementById("panel-stremio").style.display = lpTab === "stremio" ? "" : "none";
  document.getElementById("panel-calendar").style.display = lpTab === "calendar" ? "" : "none";
  document.getElementById("lp-tab-stremio").classList.toggle("active", lpTab === "stremio");
  document.getElementById("lp-tab-calendar").classList.toggle("active", lpTab === "calendar");
  try { localStorage.setItem("lp_tab", lpTab); } catch (e) {}
  setLang(curLang);
}
function buildMenu() {
  var menu = document.getElementById("lang-menu");
  for (var i = 0; i < LANGS.length; i++) {
    (function(code, name) {
      var b = document.createElement("button");
      b.className = "sort-item";
      b.setAttribute("data-lang", code);
      b.setAttribute("role", "menuitem");
      b.textContent = name;
      b.onclick = function() { setLang(code); menu.classList.remove("open"); };
      menu.appendChild(b);
    })(LANGS[i][0], LANGS[i][1]);
  }
}
function detectLang() {
  return fetch("https://ipapi.co/country/", {cache: "no-store"}).then(function(r) {
    if (!r.ok) throw 0;
    return r.text();
  }).then(function(t) {
    var cc = (t || "").trim().toUpperCase();
    return COUNTRY_LANG[cc] || "en";
  }).catch(function() {
    var nav = "";
    try { nav = (navigator.language || "en").split("-")[0].toLowerCase(); } catch (e) { nav = "en"; }
    return LP[nav] ? nav : "en";
  });
}
buildMenu();
(function init() {
  var storedTab = "";
  try { storedTab = localStorage.getItem("lp_tab") || ""; } catch (e) {}
  lpTab = (storedTab === "calendar") ? "calendar" : "stremio";
  document.getElementById("lp-tab-stremio").onclick = function() { setTab("stremio"); };
  document.getElementById("lp-tab-calendar").onclick = function() { setTab("calendar"); };
  setTab(lpTab);
  var stored = "";
  try { stored = localStorage.getItem("lp_lang") || ""; } catch (e) {}
  if (stored && LP[stored]) { setLang(stored); return; }
  setLang("en");
  detectLang().then(function(code) { setLang(code); });
})();
document.getElementById("lang-btn").onclick = function(e) {
  e.stopPropagation();
  document.getElementById("lang-menu").classList.toggle("open");
};
document.addEventListener("click", function(e) {
  var wrap = document.querySelector(".lang-wrap");
  if (wrap && !wrap.contains(e.target)) document.getElementById("lang-menu").classList.remove("open");
});
</script>
