function setList(el, arr) {
  el.innerHTML = "";
  for (var i = 0; i < arr.length; i++) {
    var li = document.createElement("li");
    li.textContent = arr[i];
    el.appendChild(li);
  }
}
function langName(code) {
  for (var i = 0; i < LANGS.length; i++) if (LANGS[i][0] === code) return LANGS[i][1];
  return code;
}
function setLang(code) {
  if (!LP[code]) code = "en";
  var d = LP[code];
  document.documentElement.lang = code;
  document.documentElement.dir = (code === "ar") ? "rtl" : "ltr";
  document.getElementById("lang-name").textContent = langName(code);
  document.getElementById("lp-tagline").textContent = d.tagline;
  document.getElementById("lp-what-t").textContent = d.what;
  setList(document.getElementById("lp-what"), d.w);
  document.getElementById("lp-install-t").textContent = d.install;
  setList(document.getElementById("lp-install"), d.s);
  document.getElementById("lp-notes-t").textContent = d.notes;
  setList(document.getElementById("lp-notes"), d.n);
  var items = document.querySelectorAll("#lang-menu .sort-item");
  for (var i = 0; i < items.length; i++) {
    if (items[i].getAttribute("data-lang") === code) items[i].classList.add("active");
    else items[i].classList.remove("active");
  }
  try { localStorage.setItem("lp_lang", code); } catch (e) {}
}
function buildMenu() {
  var menu = document.getElementById("lang-menu");
  for (var i = 0; i < LANGS.length; i++) {
    (function(code, name) {
      var b = document.createElement("button");
      b.className = "sort-item";
      b.setAttribute("data-lang", code);
      b.setAttribute("role", "menuitem");
      b.textContent = name;
      b.onclick = function() { setLang(code); menu.classList.remove("open"); };
      menu.appendChild(b);
    })(LANGS[i][0], LANGS[i][1]);
  }
}
function detectLang() {
  return fetch("https://ipapi.co/country/", {cache: "no-store"}).then(function(r) {
    if (!r.ok) throw 0;
    return r.text();
  }).then(function(t) {
    var cc = (t || "").trim().toUpperCase();
    return COUNTRY_LANG[cc] || "en";
  }).catch(function() {
    var nav = "";
    try { nav = (navigator.language || "en").split("-")[0].toLowerCase(); } catch (e) { nav = "en"; }
    return LP[nav] ? nav : "en";
  });
}
buildMenu();
(function init() {
  var stored = "";
  try { stored = localStorage.getItem("lp_lang") || ""; } catch (e) {}
  if (stored && LP[stored]) { setLang(stored); return; }
  setLang("en");
  detectLang().then(function(code) { setLang(code); });
})();
document.getElementById("lang-btn").onclick = function(e) {
  e.stopPropagation();
  document.getElementById("lang-menu").classList.toggle("open");
};
document.addEventListener("click", function(e) {
  var wrap = document.querySelector(".lang-wrap");
  if (wrap && !wrap.contains(e.target)) document.getElementById("lang-menu").classList.remove("open");
});
</script>
